[project]
name = "billbird-client"
version = "0.1.0"
description = "Python client + CLI + MCP server for Billbird's REST API."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Mark Westerweel", email = "mark@conduction.nl" }]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.0",
    "mcp>=1.2",
]

[project.urls]
Repository = "https://github.com/MWest2020/billbird-client"
Issues = "https://github.com/MWest2020/billbird-client/issues"
Billbird = "https://github.com/MWest2020/Billbird"

[project.scripts]
billbird-cli = "billbird_client.cli:app"
billbird-mcp = "billbird_client.mcp.server:run_stdio_from_cli"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/billbird_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"src/billbird_client/cli.py" = ["B008"]
"tests/*" = ["E501"]
