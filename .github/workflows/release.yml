name: Release

# Publishes to PyPI when a version tag is pushed. Uses PyPI's
# trusted-publishing (OIDC) so no API tokens live in GitHub secrets.
#
# Prerequisites (one-time, by the project owner on pypi.org):
#   1. Create the project entry on PyPI (any way — manual placeholder
#      release or via `uv publish` once with an API token).
#   2. Go to https://pypi.org/manage/project/billbird-client/settings/publishing/
#      and add this repo + workflow as a trusted publisher:
#        Owner:    MWest2020
#        Repo:     billbird-client
#        Workflow: release.yml
#        Env:      pypi
#
# After that, every tag of the form v*.*.* on this repo's default
# branch triggers a wheel+sdist build and a PyPI upload.

on:
  push:
    tags: ['v*.*.*']

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write    # OIDC for PyPI trusted publishing
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install 3.11
      - name: Verify pyproject version matches tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          declared=$(uv run python -c "import tomllib,sys; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$tag" != "$declared" ]; then
            echo "::error::tag $tag does not match pyproject version $declared"
            exit 1
          fi
      - name: Build sdist + wheel
        run: uv build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
